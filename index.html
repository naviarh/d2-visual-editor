<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>D2 visual editor (xyflow system)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    color: #1f2430; user-select: none;
  }
  .flowbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 12px; background: #eef0f3; border-bottom: 1px solid #dfe2e8;
    position: relative; z-index: 20; font-size: 13px;
  }
  button {
    padding: 6px 12px; border: 1px solid #c9cdd6; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 13px; line-height: 1.2;
  }
  button:hover { background: #f0f2f5; }
  button.active { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  button.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; font-weight: 600; }
  button.primary:hover { background: #2459c9; }
  select {
    padding: 6px 8px; border: 1px solid #c9cdd6; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 13px; line-height: 1.2; color: #1f2430;
  }
  select:hover:not(:disabled) { background: #f0f2f5; }
  select:disabled { color: #a0a6b0; background: #f7f8fa; cursor: default; }
  .sep { width: 1px; height: 20px; background: #dfe2e8; }
  #hint { margin-left: auto; color: #667085; font-size: 13px; }
  #flow { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; background: #fbfbfd; }
  #pane { flex: 1; min-height: 0; position: relative; touch-action: none; overflow: hidden; }
  #viewport { position: absolute; inset: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; z-index: 10; pointer-events: none; }
  .edge { stroke: #8a93a6; stroke-width: 2; fill: none; }
  .edge-hit { stroke: transparent; stroke-width: 14; fill: none; pointer-events: stroke; cursor: pointer; }
  .edge-g.selected .edge { stroke: #2f6fed; stroke-width: 3; }
  .elabel { fill: #1f2430; font: 15px system-ui; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
  #nodes { position: absolute; left: 0; top: 0; }
  .node {
    position: absolute; border: 2px solid #7a8699; border-radius: 8px;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .node.selected { border-color: #2f6fed; box-shadow: 0 0 0 3px rgba(47,111,237,.25); z-index: 5; }
  .node.container { border-style: dashed; background: rgba(242, 246, 255, 0.5); align-items: flex-start; justify-content: flex-start; }
  .node.container .nlabel { position: absolute; top: 4px; left: 8px; font-size: 18px; font-weight: 700; color: #3b5fbd; }
  .node.group { outline: 3px solid #e8b51e; outline-offset: 3px; }
  .node.src { border-color: #2f9e44; box-shadow: 0 0 0 3px rgba(47,158,68,.25); }
  .node.shaped { border: none; background: none; box-shadow: none; }
  .node.shaped.selected { box-shadow: 0 0 0 3px rgba(47,111,237,.25); }
  .node.shaped.src { box-shadow: 0 0 0 3px rgba(47,158,68,.25); }
  .nshape { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; }
  .nshape-path { fill: #ffffff; stroke: #7a8699; stroke-width: 2; }
  .node.selected .nshape-path { stroke: #2f6fed; }
  .node.src .nshape-path { stroke: #2f9e44; }
  .nlabel { font-size: 18px; font-weight: 600; text-align: center; padding: 6px; word-break: break-word; z-index: 1; }
  .nlabel.bottom { position: absolute; left: 0; right: 0; bottom: 4px; font-size: 14px; font-weight: 600; padding: 2px 6px; }
  #split { flex: 1; display: flex; min-height: 0; }
  #code-panel { width: 33.333%; min-width: 200px; display: flex; flex-direction: column; border-right: 1px solid #dfe2e8; }
  #divider { flex: 0 0 6px; cursor: col-resize; background: #e6e8ee; }
  #divider:hover, #divider:active { background: #c9cdd6; }
  .outbar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #eef0f3; font-size: 13px; }
  .outbar #outStatus { margin-left: auto; }
  .splitbtn { display: inline-flex; position: relative; }
  .splitbtn button { border-radius: 0; }
  .splitbtn #btnCopy { border-radius: 6px 0 0 6px; border-right: none; }
  .splitbtn #btnCopyMenu { border-radius: 0 6px 6px 0; min-width: 38px; padding: 6px 10px; font-size: 12px; line-height: 1.2; }
  #copy-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 40;
    min-width: 200px; padding: 4px; background: #fff;
    border: 1px solid #c9cdd6; border-radius: 8px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    display: flex; flex-direction: column;
  }
  #copy-menu[hidden] { display: none; }
  .menu-sep { height: 1px; margin: 4px 0; background: #dfe2e8; }
  #copy-menu button {
    text-align: left; border: none; background: transparent; border-radius: 6px;
    padding: 8px 10px; font-size: 13px; color: #1f2430;
  }
  #copy-menu button:hover { background: #f0f2f5; }
  #outStatus { color: #2f9e44; }
  #out { flex: 1; min-height: 0; width: 100%; border: none; outline: none; resize: none; padding: 10px 12px;
         background: #f6f8fa; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; user-select: text; }
  #modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(15, 23, 42, 0.35);
    display: flex; align-items: center; justify-content: center;
  }
  #modal-overlay[hidden] { display: none; }
  #modal-box {
    width: 340px; max-width: calc(100vw - 40px);
    background: #fff; border: 2px solid #7a8699; border-radius: 8px;
    box-shadow: 0 8px 30px rgba(15, 23, 42, 0.25); padding: 16px;
  }
  #modal-title { margin: 0 0 10px; font-size: 14px; font-weight: 700; color: #1f2430; cursor: move;
                 padding: 6px 4px; margin: -6px -4px 4px; user-select: none; touch-action: none; }
  #modal-input {
    width: 100%; padding: 8px 10px; margin-bottom: 14px;
    border: 1px solid #c9cdd6; border-radius: 6px;
    font-size: 14px; color: #1f2430; background: #fff; outline: none; user-select: text;
  }
  #modal-input:focus { border-color: #2f6fed; box-shadow: 0 0 0 3px rgba(47,111,237,.2); }
  #modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>

<div id="split">
  <div id="code-panel">
    <div class="outbar"><b>Код D2</b>
      <div class="splitbtn" id="splitCopy">
        <button id="btnCopy">Копировать</button>
        <button id="btnCopyMenu" class="chevron" title="Дополнительные действия с кодом" aria-haspopup="menu" aria-expanded="false">▾</button>
        <div id="copy-menu" role="menu" hidden>
          <button role="menuitem" data-act="paste">Вставить</button>
          <button role="menuitem" data-act="replace">Заменить</button>
          <button role="menuitem" data-act="import">Импорт…</button>
          <button role="menuitem" data-act="export">Экспорт…</button>
          <div class="menu-sep"></div>
          <button role="menuitem" data-act="export-svg">Экспорт в SVG</button>
          <button role="menuitem" data-act="export-drawio">Экспорт в Draw.io</button>
          <button role="menuitem" data-act="export-mermaid">Экспорт в Mermaid</button>
          <button role="menuitem" data-act="import-mermaid">Импорт из Mermaid</button>
        </div>
      </div>
      <button id="btnPos">Скрыть позиции</button><span id="outStatus"></span>
    </div>
    <input type="file" id="import-file" accept=".d2,.txt,text/plain" hidden/>
    <textarea id="out" spellcheck="false" wrap="off"></textarea>
  </div>
  <div id="divider" title="Перетащите, чтобы изменить ширину"></div>
  <div id="flow">
    <div class="flowbar"><b>Схема</b>
      <button id="btnBlock">+ Блок</button>
      <select id="shapeSel" title="Форма блока (выбранного или по умолчанию для новых)"></select>
      <button id="btnGroup">Группировать блоки</button>
      <button id="btnEdge">+ Стрелка</button>
      <select id="dirSel" title="Направление стрелки"></select>
      <span class="sep"></span>
      <button id="btnSort">Упорядочить по связям</button>
      <span class="sep"></span>
      <button id="btnZoomIn">+</button>
      <button id="btnZoomOut">−</button>
      <button id="btnFit">Fit</button>
      <span id="hint"></span>
    </div>
    <div id="pane">
      <div id="viewport">
        <svg id="edges"></svg>
        <div id="nodes"></div>
      </div>
    </div>
  </div>
</div>

<div id="modal-overlay" hidden>
  <div id="modal-box">
    <div id="modal-title"></div>
    <input id="modal-input" type="text" spellcheck="false"/>
    <div id="modal-actions">
      <button id="modal-cancel">Отмена</button>
      <button id="modal-ok" class="primary">OK</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@xyflow/system/dist/umd/index.js"></script>
<script src="js/d2-serialize.js"></script>
<script src="js/d2-parse.js"></script>
<script src="js/d2-merge.js"></script>
<script src="js/d2-layout.js"></script>
<script src="js/d2-sort.js"></script>
<script src="js/d2-shapes.js"></script>
<script>
"use strict";

const XYF = window.XYFlowSystem;
const D2S = window.d2mod;
const D2P = window.d2parse;
const D2M = window.d2merge;
const D2L = window.d2layout;
const D2SORT = window.d2sort;
const D2SHP = window.d2shapes;
const pane = document.getElementById("pane");
const viewportEl = document.getElementById("viewport");
const nodesEl = document.getElementById("nodes");
const svgEl = document.getElementById("edges");
const modalOverlay = document.getElementById("modal-overlay");
const modalBox = document.getElementById("modal-box");
const modalTitle = document.getElementById("modal-title");
const modalInput = document.getElementById("modal-input");
const modalOk = document.getElementById("modal-ok");
const modalCancel = document.getElementById("modal-cancel");
const shapeSel = document.getElementById("shapeSel");
const dirSel = document.getElementById("dirSel");

shapeSel.innerHTML = '<option value="">Тип блока</option>'
  + D2SHP.SHAPE_NAMES.map((s) => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join("");

// "Направление" is the default button label (direct direction); the list also
// carries the explicit label for each of the four D2 arrow directions.
dirSel.innerHTML = '<option value="->">Направление</option>'
  + '<option value="->">Прямое</option>'
  + '<option value="<-">Обратное</option>'
  + '<option value="<->">Обе стороны</option>'
  + '<option value="--">Без стрелки</option>';

modalTitle.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const rect = modalBox.getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  modalBox.style.position = "fixed";
  modalBox.style.left = rect.left + "px";
  modalBox.style.top = rect.top + "px";
  modalBox.style.margin = "0";
  const onMove = (ev) => {
    const nx = Math.max(0, Math.min(rect.left + ev.clientX - startX, window.innerWidth - rect.width));
    const ny = Math.max(0, Math.min(rect.top + ev.clientY - startY, window.innerHeight - rect.height));
    modalBox.style.left = nx + "px";
    modalBox.style.top = ny + "px";
  };
  const onUp = () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
  };
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
});

const nodes = new Map();
const edges = [];
let viewport = { x: 0, y: 0, zoom: 1 };
let selectedId = null;
let selectedEdgeId = null;
let mode = null;
let edgeSrc = null;
let groupParent = null;
let lastClickId = null;
let lastClickTime = 0;
let lastEdgeClickId = null;
let lastEdgeClickTime = 0;
let idCounter = 1;
let order = [];
let showComments = true;
let lastGraphText = "";
let exportName = null;

const STORE_KEY = "d2editor:v1";
const UI_KEY = "d2editor:ui:v1";
const GEN_IDLE_MS = 1000;
const TEXT_EDIT_MS = 3000;
const EDGE_FANOUT = 21;
const EDGE_INSET = 6;
const EDGE_TIP_LEN = 24;
const EDGE_TIP_W = 12;
let saveTimer = null;
let genTimer = null;
let textTimer = null;

function queueGen() {
  clearTimeout(genTimer);
  genTimer = setTimeout(() => {
    const out = document.getElementById("out");
    if (out.value === lastGraphText) regenerateTextView();
  }, GEN_IDLE_MS);
}

function currentGraph() {
  const ns = [];
  for (const n of nodes.values()) {
    ns.push({
      ...n,
      children: (n.children || []).slice(),
      x: n.x || 0,
      y: n.y || 0,
      hasPos: true,
      comments: n.comments || [],
      trailingComment: n.trailingComment || null,
      rawAttrs: n.rawAttrs || []
    });
  }
  const es = edges.map((e) => ({
    ...e,
    comments: e.comments || [],
    trailingComment: e.trailingComment || null,
    rawAttrs: e.rawAttrs || []
  }));
  return {
    v: 2, nodes: ns, edges: es, order: order.slice(), idCounter,
    viewport: { ...viewport }, showComments
  };
}

function applyGraph(g) {
  nodes.clear();
  for (const n of g.nodes) nodes.set(n.id, n);
  edges.length = 0;
  edges.push(...g.edges);
  order = g.order.slice();
  idCounter = g.idCounter;
}

function syncOrder() {
  const seen = new Set();
  const keep = [];
  for (const id of order) {
    if (nodes.has(id)) { keep.push(id); seen.add(id); }
  }
  for (const n of D2S.treeOrder(currentGraph())) {
    if (!seen.has(n.id)) { keep.push(n.id); seen.add(n.id); }
  }
  for (const ed of edges) {
    if (!seen.has(ed.id)) { keep.push(ed.id); seen.add(ed.id); }
  }
  order = keep;
}

function regenerateTextView() {
  const g = currentGraph();
  const text = showComments ? D2S.serializeAnnotated(g) : D2S.serializeClean(g);
  lastGraphText = text;
  document.getElementById("out").value = text;
  document.getElementById("btnPos").textContent = showComments ? "Скрыть позиции" : "Показать позиции";
  document.getElementById("btnPos").classList.toggle("active", showComments);
}

function setStatus(text, ok) {
  const el = document.getElementById("outStatus");
  el.textContent = text;
  el.style.color = ok ? "#2f9e44" : "#d6382b";
}

function togglePositions() {
  const out = document.getElementById("out");
  const clean = out.value === lastGraphText;
  showComments = !showComments;
  if (clean) regenerateTextView();
  queueSave();
}

function onTextEdit() {
  const out = document.getElementById("out");
  const r = D2P.parseD2(out.value);
  if (!r.ok) {
    setStatus("Ошибка D2: строка " + r.error.line + " — " + r.error.message, false);
    return;
  }
  const merged = D2M.mergeGraph(r.graph, currentGraph(), { selectedId, selectedEdgeId });
  const added = merged.added;
  const removed = merged.removed;
  const center = centerFlow();
  for (const id of added) D2L.placeNewNode(merged.graph, id, { center });
  applyGraph(merged.graph);
  selectedId = merged.selectedId;
  selectedEdgeId = merged.selectedEdgeId;
  renderEdges();
  renderNodes();
  renderHint();
  queueSave();
  if (added.length || removed.length) {
    regenerateTextView();
    setStatus(added.length ? "Новых блоков: " + added.length + " (авто-позиция)" : "Синхронизировано", true);
  } else {
    lastGraphText = out.value;
    setStatus("Синхронизировано", true);
  }
}

function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 400);
}

function saveState() {
  try {
    const data = {
      v: 1,
      nodes: [...nodes.values()].map((n) => ({ ...n, children: n.children.slice() })),
      edges,
      idCounter,
      viewport,
      order,
      showComments
    };
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  } catch (e) {
    // переполнение хранилища или приватный режим — молча пропускаем
  }
}

function loadState() {
  let raw;
  try {
    raw = localStorage.getItem(STORE_KEY);
  } catch (e) {
    return false;
  }
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    if (!data || data.v !== 1 || !Array.isArray(data.nodes) || !Array.isArray(data.edges)) return false;
    nodes.clear();
    for (const n of data.nodes) {
      if (!n || typeof n.id !== "string") return false;
      nodes.set(n.id, { ...n, children: n.children || [] });
    }
    edges.length = 0;
    edges.push(...data.edges);
    if (Number.isFinite(data.idCounter)) idCounter = data.idCounter;
    if (data.viewport && Number.isFinite(data.viewport.x)) viewport = { ...data.viewport };
    if (Array.isArray(data.order) && data.order.length) order = data.order;
    if (typeof data.showComments === "boolean") showComments = data.showComments;
    return true;
  } catch (e) {
    return false;
  }
}

function absPos(n) {
  let x = n.x, y = n.y, p = n.parentId, guard = 0;
  while (p && nodes.has(p) && guard++ < 100) {
    const par = nodes.get(p);
    x += par.x; y += par.y;
    p = par.parentId;
  }
  return { x, y };
}

function isContainer(n) {
  return !!n.children && n.children.length > 0;
}

function boxSize(n) {
  const memo = new Set();
  function measure(x) {
    if (!isContainer(x)) {
      const norm = D2SHP.normalizeRatio(x.shape || null, x.w, x.h);
      return { w: norm.w, h: norm.h };
    }
    if (memo.has(x.id)) return { w: 0, h: 0 };
    memo.add(x.id);
    const PAD = 24, HEAD = 28;
    let w = 0, h = 0;
    for (const id of x.children) {
      const c = nodes.get(id);
      if (!c) continue;
      const s = measure(c);
      w = Math.max(w, c.x + s.w);
      h = Math.max(h, c.y + s.h);
    }
    return { w: w + PAD * 2, h: h + HEAD + PAD };
  }
  return measure(n);
}

function treeOrder() {
  const order = [];
  const visiting = new Set();
  const visit = (n) => {
    if (visiting.has(n.id)) return;
    visiting.add(n.id);
    order.push(n);
    for (const id of n.children) {
      const c = nodes.get(id);
      if (c) visit(c);
    }
    visiting.delete(n.id);
  };
  for (const n of nodes.values()) {
    if (!n.parentId || !nodes.has(n.parentId)) visit(n);
  }
  return order;
}

function isDescendant(ancId, nodeId) {
  let n = nodes.get(nodeId), guard = 0;
  while (n && guard++ < 100) {
    if (n.id === ancId) return true;
    n = n.parentId ? nodes.get(n.parentId) : null;
  }
  return false;
}

function setParent(n, parId) {
  const old = n.parentId && nodes.has(n.parentId) ? nodes.get(n.parentId) : null;
  if (old) {
    const i = old.children.indexOf(n.id);
    if (i >= 0) old.children.splice(i, 1);
  }
  n.parentId = parId;
  const par = parId && nodes.has(parId) ? nodes.get(parId) : null;
  if (par && par.children.indexOf(n.id) < 0) par.children.push(n.id);
}

function normalizeContainer(par) {
  if (!par.children.length) return;
  const PAD = 24, HEAD = 28;
  let minX = Infinity, minY = Infinity;
  for (const id of par.children) {
    const c = nodes.get(id);
    if (!c) continue;
    minX = Math.min(minX, c.x);
    minY = Math.min(minY, c.y);
  }
  const shiftX = PAD - minX;
  const shiftY = HEAD - minY;
  if (shiftX !== 0 || shiftY !== 0) {
    par.x -= shiftX;
    par.y -= shiftY;
    for (const id of par.children) {
      const c = nodes.get(id);
      if (!c) continue;
      c.x += shiftX;
      c.y += shiftY;
    }
  }
}

function applyViewport(vp) {
  viewport = vp;
  viewportEl.style.transform = "translate(" + vp.x + "px," + vp.y + "px) scale(" + vp.zoom + ")";
  queueSave();
}

const panZoom = XYF.XYPanZoom({
  domNode: pane,
  minZoom: 0.2,
  maxZoom: 4,
  translateExtent: XYF.infiniteExtent,
  viewport: { x: 0, y: 0, zoom: 1 },
  onDraggingChange: () => {}
});
panZoom.update({
  panOnDrag: true,
  panOnScroll: false,
  zoomOnScroll: true,
  zoomOnPinch: true,
  zoomOnDoubleClick: false,
  zoomActivationKeyPressed: false,
  panOnScrollMode: XYF.PanOnScrollMode.Free,
  preventScrolling: true,
  userSelectionActive: false,
  connectionInProgress: false,
  selectionOnDrag: false,
  lib: "xy",
  noPanClassName: "nopan",
  noWheelClassName: "nowheel",
  paneClickDistance: 0,
  onTransformChange: (view) => applyViewport({ x: view[0], y: view[1], zoom: view[2] }),
  onPaneContextMenu: (e) => e.preventDefault()
});

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Shape-aware edge anchoring: source/target points land on the node's shape
// contour (outline intersection), falling back to the axis-aligned box border
// for containers and as a safety net.
function nodeShapeBox(n, s) {
  if (isContainer(n)) return { w: s.w, h: s.h, container: true, shape: null };
  const norm = D2SHP.normalizeRatio(n.shape || null, s.w, s.h);
  return { w: norm.w, h: norm.h, container: false, shape: n.shape || null };
}

function edgeGeometry(sa, ss, ta, ts, s, t, offset, dir) {
  const sb = nodeShapeBox(s, ss), tb = nodeShapeBox(t, ts);
  const scx = sa.x + sb.w / 2, scy = sa.y + sb.h / 2;
  const tcx = ta.x + tb.w / 2, tcy = ta.y + tb.h / 2;
  const adx = tcx - scx, ady = tcy - scy;
  const L = Math.hypot(adx, ady);
  // Parallel fan-out: shift the center ray perpendicular to itself so several
  // edges between the same pair draw side by side instead of overlapping.
  const d = (offset && L > 0) ? offset : 0;
  const nx = d * (-ady / L), ny = d * (adx / L);
  // Intersect the shifted ray with the ACTUAL node outline (the outline keeps
  // its real center), so fanned-out edges touch the shape's contour exactly.
  const border = (rsx, rsy, box, cx, cy, dx, dy) => {
    if (dx === 0 && dy === 0) return { x: rsx, y: rsy };
    if (!box.container) {
      const outline = D2SHP.outlinePoints(box.shape, {
        x: cx - box.w / 2, y: cy - box.h / 2, w: box.w, h: box.h
      });
      const hit = D2SHP.outlineIntersect(outline, rsx, rsy, dx, dy);
      if (hit) return hit;
    }
    const hw = box.w / 2, hh = box.h / 2;
    const s = Math.min(hw / Math.abs(dx), hh / Math.abs(dy));
    return { x: rsx + dx * s, y: rsy + dy * s };
  };
  let spPos, tpPos;
  if (Math.abs(adx) > Math.abs(ady)) {
    spPos = adx > 0 ? XYF.Position.Right : XYF.Position.Left;
    tpPos = adx > 0 ? XYF.Position.Left : XYF.Position.Right;
  } else {
    spPos = ady > 0 ? XYF.Position.Bottom : XYF.Position.Top;
    tpPos = ady > 0 ? XYF.Position.Top : XYF.Position.Bottom;
  }
  const sp = border(scx + nx, scy + ny, sb, scx, scy, adx, ady);
  const tp = border(tcx + nx, tcy + ny, tb, tcx, tcy, -adx, -ady);
  // Stop the line short of the border along the approach axis so the sharp
  // arrowhead tip (which overhangs the path end by EDGE_INSET) is not spoiled
  // by the line's own stroke width. Only ends that carry an arrowhead are
  // inset — a plain end stays flush with the node border.
  const inset = (p, pos) => {
    switch (pos) {
      case XYF.Position.Left: return { x: p.x - EDGE_INSET, y: p.y };
      case XYF.Position.Right: return { x: p.x + EDGE_INSET, y: p.y };
      case XYF.Position.Top: return { x: p.x, y: p.y - EDGE_INSET };
      default: return { x: p.x, y: p.y + EDGE_INSET };
    }
  };
  const d2 = dir || "->";
  const insS = (d2 === "<-" || d2 === "<->");
  const insT = (d2 === "->" || d2 === "<->");
  return {
    sp: insS ? inset(sp, spPos) : sp,
    tp: insT ? inset(tp, tpPos) : tp,
    spPos, tpPos
  };
}

// SVG <defs> for both arrow markers, shared by the interactive renderer and
// the SVG export. The triangle is EDGE_TIP_LEN long along the line; its tip is
// at the local origin, and refX lets the tip overhang the path end by
// EDGE_INSET (the line itself is shortened by the same amount in edgeGeometry).
function markerDefs() {
  return '<defs>'
    + '<marker id="arrow" viewBox="-24 -6 24 12" refX="' + (-EDGE_INSET)
    + '" refY="0" markerWidth="24" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">'
    + '<path d="M -24 -6 L 0 0 L -24 6 z" fill="#8a93a6"/></marker>'
    + '<marker id="arrow-start" viewBox="0 -6 24 12" refX="' + EDGE_INSET
    + '" refY="0" markerWidth="24" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">'
    + '<path d="M 0 0 L 24 -6 L 24 6 z" fill="#8a93a6"/></marker>'
    + '</defs>';
}

// SVG marker attributes per edge direction; the start marker is mirrored so the
// arrowhead points into the source node (like d2's separate start marker).
function edgeMarkers(ed) {
  const dir = ed.dir || "->";
  if (dir === "->") return ' marker-end="url(#arrow)"';
  if (dir === "<-") return ' marker-start="url(#arrow-start)"';
  if (dir === "<->") return ' marker-start="url(#arrow-start)" marker-end="url(#arrow)"';
  return "";
}

// Group edges by the unordered (source, target) pair and assign each a
// perpendicular offset so parallel connections (any direction, any text order)
// draw side by side; a single edge keeps offset 0 (unchanged path).
function parallelOffsets(edges) {
  const groups = new Map();
  for (const ed of edges) {
    const a = ed.source, b = ed.target;
    const key = a < b ? a + "\u0000" + b : b + "\u0000" + a;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(ed);
  }
  const out = new Map();
  for (const list of groups.values()) {
    if (list.length === 1) { out.set(list[0], 0); continue; }
    for (let i = 0; i < list.length; i++) {
      const ed = list[i];
      // edgeGeometry computes the perpendicular normal from the text-order ray
      // (source -> target), which flips for reversed records of the same pair.
      // Flip the sign too so all edges of the pair fan out to distinct sides.
      const dirSign = ed.source < ed.target ? 1 : -1;
      out.set(ed, (i - (list.length - 1) / 2) * EDGE_FANOUT * dirSign);
    }
  }
  return out;
}

function renderEdges() {
  let inner = markerDefs();
  const offsets = parallelOffsets(edges);
  for (const ed of edges) {
    const s = nodes.get(ed.source), t = nodes.get(ed.target);
    if (!s || !t) continue;
    const sa = absPos(s), ta = absPos(t);
    const ss = boxSize(s), ts = boxSize(t);
    const g = edgeGeometry(sa, ss, ta, ts, s, t, offsets.get(ed), ed.dir);
    const [path, lx, ly] = XYF.getSmoothStepPath({
      sourceX: g.sp.x, sourceY: g.sp.y, sourcePosition: g.spPos,
      targetX: g.tp.x, targetY: g.tp.y, targetPosition: g.tpPos
    });
    inner += '<g class="edge-g' + (selectedEdgeId === ed.id ? " selected" : "") + '" data-id="' + esc(ed.id) + '">'
      + '<path d="' + path + '" class="edge-hit"></path>'
      + '<path d="' + path + '" class="edge"' + edgeMarkers(ed) + '></path>';
    if (ed.label) {
      inner += '<text x="' + lx + '" y="' + ly + '" text-anchor="middle" dominant-baseline="middle" class="elabel">' + esc(ed.label) + '</text>';
    }
    inner += '</g>';
  }
  svgEl.innerHTML = inner;
}

function shapeLabelBottom(n) {
  if (isContainer(n)) return false;
  const name = n.shape ? String(n.shape).toLowerCase() : "";
  return name === "person" || name === "c4-person";
}

function renderNodes() {
  nodesEl.innerHTML = "";
  for (const n of treeOrder()) {
    const a = absPos(n);
    const s = boxSize(n);
    const el = document.createElement("div");
    el.className = "node"
      + (isContainer(n) ? " container" : " shaped")
      + (selectedId === n.id ? " selected" : "")
      + (groupParent === n.id ? " group" : "")
      + (edgeSrc === n.id ? " src" : "");
    el.style.left = a.x + "px";
    el.style.top = a.y + "px";
    el.style.width = s.w + "px";
    el.style.height = s.h + "px";
    if (!isContainer(n)) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "nshape");
      svg.setAttribute("width", s.w);
      svg.setAttribute("height", s.h);
      svg.setAttribute("viewBox", "0 0 " + s.w + " " + s.h);
      const paths = D2SHP.renderShape(n.shape || null, { x: 0, y: 0, w: s.w, h: s.h });
      for (const d of paths) {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("class", "nshape-path");
        svg.appendChild(path);
      }
      el.appendChild(svg);
    }
    const lab = document.createElement("div");
    lab.className = "nlabel" + (shapeLabelBottom(n) ? " bottom" : "");
    lab.textContent = n.label;
    el.appendChild(lab);
    el.addEventListener("mousedown", (e) => e.stopPropagation());
    el.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      startDrag(e, n);
    });
    nodesEl.appendChild(el);
  }
}

function renderHint() {
  document.getElementById("btnEdge").classList.toggle("active", mode === "edge");
  document.getElementById("btnGroup").classList.toggle("active", mode === "group");
  const sel = nodes.get(selectedId);
  // Mirror of dirSel: only reflect the selection back into the control; when
  // nothing shapeable is selected the control keeps the pending default shape.
  if (sel && !isContainer(sel)) shapeSel.value = sel.shape || "";
  const ed = selectedEdgeId ? edges.find((e) => e.id === selectedEdgeId) : null;
  if (ed) dirSel.value = ed.dir || "->";
  let txt = "Клик — выбрать. Drag — двигать. Двойной клик по блоку — переименовать, по стрелке — подпись. Delete — удалить.";
  if (mode === "edge") {
    txt = edgeSrc
      ? "Источник: " + nodeLabel(edgeSrc) + ". Кликните по блоку-цели."
      : "Кликните по блоку-источнику стрелки.";
  } else if (mode === "group") {
    txt = groupParent
      ? "Контейнер: " + nodeLabel(groupParent) + ". Кликните по блокам, чтобы вложить или вынуть."
      : "Кликните по блоку, который станет контейнером.";
  }
  document.getElementById("hint").textContent = txt;
}

function nodeLabel(id) {
  const n = nodes.get(id);
  return n ? n.label : id;
}

function render() {
  renderEdges();
  renderNodes();
  renderHint();
  queueSave();
  queueGen();
}

function startDrag(e, n) {
  let lastX = e.clientX, lastY = e.clientY, moved = false;
  function onMove(ev) {
    const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
    if (!moved && Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) > 3) moved = true;
    if (moved) {
      ev.preventDefault();
      n.x += dx / viewport.zoom;
      n.y += dy / viewport.zoom;
      lastX = ev.clientX; lastY = ev.clientY;
      render();
    }
  }
  function onUp() {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    if (!moved) {
      // The first click re-renders nodes (renderNodes rebuilds the DOM), so a
      // native dblclick would never fire on the replaced element. Detect the
      // double click manually by node id + time instead.
      const now = Date.now();
      const isDbl = lastClickId === n.id && now - lastClickTime < 500;
      lastClickId = n.id;
      lastClickTime = now;
      if (isDbl) {
        renameNode(n);
      } else {
        handleNodeClick(n);
      }
    }
  }
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
}

async function handleNodeClick(n) {
  selectedEdgeId = null;
  if (mode === "edge") {
    if (!edgeSrc) {
      edgeSrc = n.id;
      render();
      return;
    }
    if (edgeSrc === n.id) {
      edgeSrc = null;
      render();
      return;
    }
    const src = edgeSrc;
    edgeSrc = null;
    // Every creation is a new connection (d2: "repeated connections declare
    // new ones"); the chosen direction becomes the new edge's direction.
    const label = (await openEditDialog({ title: "Подпись стрелки (необязательно):", value: "" }) || "").trim();
    const id = "e" + (idCounter++);
    const edge = { id, source: src, target: n.id, label };
    const dir = dirSel.value;
    if (dir !== "->") edge.dir = dir;
    edges.push(edge);
    order.push(id);
    render();
    return;
  }
  if (mode === "group") {
    if (!groupParent) {
      groupParent = n.id;
      render();
      return;
    }
    if (groupParent === n.id) {
      groupParent = null;
      render();
      return;
    }
    const par = nodes.get(groupParent);
    const a = absPos(n);
    const pa = absPos(par);
    if (n.parentId === groupParent) {
      setParent(n, null);
      n.x = a.x;
      n.y = a.y;
    } else if (!isDescendant(groupParent, n.id)) {
      setParent(n, groupParent);
      n.x = a.x - pa.x;
      n.y = a.y - pa.y;
    }
    normalizeContainer(par);
    render();
    return;
  }
  selectedId = selectedId === n.id ? null : n.id;
  render();
}

function openEditDialog(opts) {
  return new Promise((resolve) => {
    if (modalBox.style.position === "fixed") {
      const r = modalBox.getBoundingClientRect();
      modalBox.style.left = Math.max(0, Math.min(parseFloat(modalBox.style.left) || r.left, window.innerWidth - r.width)) + "px";
      modalBox.style.top = Math.max(0, Math.min(parseFloat(modalBox.style.top) || r.top, window.innerHeight - r.height)) + "px";
    }
    modalTitle.textContent = opts.title;
    modalInput.value = opts.value || "";
    modalOverlay.hidden = false;
    modalInput.focus();
    modalInput.select();
    const done = (val) => {
      modalOverlay.hidden = true;
      modalOverlay.removeEventListener("click", onOverlay);
      modalOk.removeEventListener("click", onOk);
      modalCancel.removeEventListener("click", onCancel);
      modalInput.removeEventListener("keydown", onKey);
      resolve(val);
    };
    const onOk = () => done(modalInput.value);
    const onCancel = () => done(null);
    const onOverlay = (e) => { if (e.target === modalOverlay) done(null); };
    const onKey = (e) => {
      e.stopPropagation();
      if (e.key === "Enter") onOk();
      else if (e.key === "Escape") onCancel();
    };
    modalOverlay.addEventListener("click", onOverlay);
    modalOk.addEventListener("click", onOk);
    modalCancel.addEventListener("click", onCancel);
    modalInput.addEventListener("keydown", onKey);
  });
}

async function renameNode(n) {
  const raw = (await openEditDialog({ title: "Новое название блока:", value: n.label }) || "").trim();
  if (!raw) return;
  let id = raw, i = 2;
  while (id !== n.id && nodes.has(id)) id = raw + "-" + (i++);
  if (id !== n.id) {
    const oldId = n.id;
    nodes.delete(oldId);
    for (const ed of edges) {
      if (ed.source === oldId) ed.source = id;
      if (ed.target === oldId) ed.target = id;
    }
    if (n.parentId && nodes.has(n.parentId)) {
      const par = nodes.get(n.parentId);
      const i = par.children.indexOf(oldId);
      if (i >= 0) par.children[i] = id;
    }
    for (const nn of nodes.values()) if (nn.parentId === oldId) nn.parentId = id;
    order = order.map((x) => (x === oldId ? id : x));
    if (selectedId === oldId) selectedId = id;
    if (edgeSrc === oldId) edgeSrc = id;
    if (groupParent === oldId) groupParent = id;
  }
  n.id = id;
  n.label = raw;
  nodes.set(id, n);
  render();
}

async function renameEdge(id) {
  const ed = edges.find((e) => e.id === id);
  if (!ed) return;
  const raw = (await openEditDialog({ title: "Подпись стрелки:", value: ed.label || "" }) || "").trim();
  if (raw === ed.label) return;
  ed.label = raw;
  render();
}

function deleteNode(id) {
  const n = nodes.get(id);
  if (!n) return;
  for (const cid of n.children.slice()) {
    const c = nodes.get(cid);
    if (!c) continue;
    const a = absPos(c);
    setParent(c, null);
    c.x = a.x;
    c.y = a.y;
  }
  nodes.delete(id);
  for (let i = edges.length - 1; i >= 0; i--) {
    const ed = edges[i];
    if (ed.source === id || ed.target === id) edges.splice(i, 1);
  }
  syncOrder();
  if (selectedId === id) selectedId = null;
  if (edgeSrc === id) edgeSrc = null;
  if (groupParent === id) groupParent = null;
  render();
}

function deleteEdge(id) {
  const i = edges.findIndex((ed) => ed.id === id);
  if (i < 0) return;
  edges.splice(i, 1);
  syncOrder();
  selectedEdgeId = null;
  render();
}

function centerFlow() {
  const r = pane.getBoundingClientRect();
  return {
    x: (r.left + r.width / 2 - viewport.x) / viewport.zoom,
    y: (r.top + r.height / 2 - viewport.y) / viewport.zoom
  };
}

async function addBlock() {
  const label = (await openEditDialog({ title: "Название блока:", value: "" }) || "").trim() || ("Блок " + (idCounter++));
  let id = label, i = 2;
  while (nodes.has(id)) id = label + "-" + (i++);
  const c = centerFlow();
  const n = { id, label, x: c.x - 75, y: c.y - 35, w: 150, h: 70, parentId: null, children: [] };
  // The "Тип блока" selector serves as the default for new blocks (like the
  // direction selector does for new edges); the empty option means no shape.
  const shape = shapeSel.value;
  if (shape) n.shape = shape;
  nodes.set(id, n);
  order.push(id);
  selectedId = id;
  render();
}

function fitView() {
  const items = treeOrder();
  if (!items.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of items) {
    const a = absPos(n);
    const s = boxSize(n);
    minX = Math.min(minX, a.x);
    minY = Math.min(minY, a.y);
    maxX = Math.max(maxX, a.x + s.w);
    maxY = Math.max(maxY, a.y + s.h);
  }
  const r = pane.getBoundingClientRect();
  const vw = r.width, vh = r.height, pad = 60;
  const bw = maxX - minX, bh = maxY - minY;
  if (!bw || !bh) return;
  const zoom = Math.max(0.2, Math.min(4, Math.min((vw - 2 * pad) / bw, (vh - 2 * pad) / bh, 1.5)));
  const x = (vw - bw * zoom) / 2 - minX * zoom;
  const y = (vh - bh * zoom) / 2 - minY * zoom;
  panZoom.setViewport({ x, y, zoom }).then(() => applyViewport({ x, y, zoom }));
}

function toggleMode(m) {
  if (mode === m) {
    mode = null;
  } else {
    mode = m;
  }
  edgeSrc = null;
  groupParent = null;
  render();
}

document.getElementById("btnBlock").onclick = addBlock;
document.getElementById("btnEdge").onclick = () => toggleMode("edge");
document.getElementById("btnGroup").onclick = () => toggleMode("group");
// With a block selected the choice sets its shape; otherwise it becomes the
// default shape for new blocks (the selector stays enabled either way), the
// same split of roles as dirSel for edge direction.
shapeSel.onchange = () => {
  const n = nodes.get(selectedId);
  if (!n || isContainer(n)) return;
  const v = shapeSel.value;
  if (!v) delete n.shape;
  else n.shape = v;
  render();
};
// With an edge selected the choice changes its direction; otherwise it becomes
// the default direction for new edges (button stays enabled either way).
dirSel.onchange = () => {
  const ed = selectedEdgeId ? edges.find((e) => e.id === selectedEdgeId) : null;
  if (!ed) return;
  const v = dirSel.value;
  if (v === "->") delete ed.dir;
  else ed.dir = v;
  render();
};
document.getElementById("btnZoomIn").onclick = () => panZoom.scaleBy(1.3);
document.getElementById("btnZoomOut").onclick = () => panZoom.scaleBy(1 / 1.3);
document.getElementById("btnFit").onclick = fitView;
document.getElementById("btnPos").onclick = togglePositions;
document.getElementById("btnSort").onclick = () => {
  applyGraph(D2SORT.sortByArrows(currentGraph()));
  render();
  if (document.getElementById("out").value === lastGraphText) regenerateTextView();
  queueSave();
  setStatus("Синхронизировано", true);
};
document.getElementById("out").addEventListener("input", () => {
  clearTimeout(textTimer);
  textTimer = setTimeout(onTextEdit, TEXT_EDIT_MS);
});

document.getElementById("btnCopy").onclick = async () => {
  const out = document.getElementById("out");
  try {
    await navigator.clipboard.writeText(out.value);
  } catch (e) {
    out.select();
    document.execCommand("copy");
  }
  document.getElementById("outStatus").textContent = "Скопировано";
  setTimeout(() => { document.getElementById("outStatus").textContent = ""; }, 1500);
};

const splitCopy = document.getElementById("splitCopy");
const btnCopyMenu = document.getElementById("btnCopyMenu");
const copyMenu = document.getElementById("copy-menu");
const importFile = document.getElementById("import-file");
const outEl = document.getElementById("out");

function setCopyMenu(open) {
  copyMenu.hidden = !open;
  btnCopyMenu.classList.toggle("active", open);
  btnCopyMenu.setAttribute("aria-expanded", String(open));
}

btnCopyMenu.addEventListener("click", (e) => {
  e.stopPropagation();
  setCopyMenu(copyMenu.hidden);
});

document.addEventListener("click", (e) => {
  if (!copyMenu.hidden && !splitCopy.contains(e.target)) setCopyMenu(false);
});

copyMenu.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  setCopyMenu(false);
  if (act === "paste") pasteFromClipboard();
  else if (act === "replace") replaceFromClipboard();
  else if (act === "import") importFile.click();
  else if (act === "export") exportD2();
  else if (act === "export-svg") exportSVG();
  else if (act === "export-drawio") setStatus("Экспорт в Draw.io — в разработке", false);
  else if (act === "export-mermaid") setStatus("Экспорт в Mermaid — в разработке", false);
  else if (act === "import-mermaid") setStatus("Импорт из Mermaid — в разработке", false);
});

function applyCode(text) {
  outEl.value = text;
  clearTimeout(textTimer);
  onTextEdit();
}

async function readClipboard() {
  try {
    return await navigator.clipboard.readText();
  } catch (e) {
    return null;
  }
}

async function pasteFromClipboard() {
  const txt = await readClipboard();
  if (txt == null) {
    setStatus("Буфер обмена недоступен — используйте Ctrl+V", false);
    return;
  }
  const start = outEl.selectionStart, end = outEl.selectionEnd;
  outEl.value = outEl.value.slice(0, start) + txt + outEl.value.slice(end);
  outEl.selectionStart = outEl.selectionEnd = start + txt.length;
  clearTimeout(textTimer);
  onTextEdit();
}

async function replaceFromClipboard() {
  const txt = await readClipboard();
  if (txt == null) {
    setStatus("Буфер обмена недоступен — используйте Ctrl+V", false);
    return;
  }
  applyCode(txt);
}

importFile.addEventListener("change", async () => {
  const f = importFile.files && importFile.files[0];
  importFile.value = "";
  if (!f) return;
  let txt;
  try {
    txt = await f.text();
  } catch (e) {
    setStatus("Не удалось прочитать файл", false);
    return;
  }
  applyCode(txt);
});

async function exportD2() {
  const content = outEl.value;
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: exportName || "diagram.d2",
        types: [{ description: "D2-схема", accept: { "application/x-d2": [".d2"] } }],
        excludeAcceptAllOption: true
      });
      let name = handle.name;
      if (!/\.d2$/i.test(name)) {
        const fixed = (name.replace(/\.\w+$/, "") || "diagram") + ".d2";
        try {
          await handle.move(fixed);
          name = fixed;
        } catch (e) {}
      }
      const writable = await handle.createWritable();
      await writable.write(content);
      await writable.close();
      exportName = name;
      saveUiPrefs({ exportName: name });
      setStatus("Экспортировано в " + name, true);
      setTimeout(() => { document.getElementById("outStatus").textContent = ""; }, 1500);
      return;
    } catch (e) {
      if (e.name !== "AbortError") setStatus("Не удалось экспортировать файл", false);
      return;
    }
  }
  const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = exportName || "diagram.d2";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  setStatus("Экспортировано в " + (exportName || "diagram.d2"), true);
  setTimeout(() => { document.getElementById("outStatus").textContent = ""; }, 1500);
}

const SVG_FONT = "system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";
const SVG_LINE_H = 22;
let _svgCtx = null;

function svgTextCtx() {
  if (!_svgCtx) _svgCtx = document.createElement("canvas").getContext("2d");
  return _svgCtx;
}

function svgFontMetrics(font) {
  const ctx = svgTextCtx();
  ctx.font = font;
  const m = ctx.measureText("Ág");
  return {
    ascent: m.actualBoundingBoxAscent || parseFloat(font) * 0.8,
    descent: m.actualBoundingBoxDescent || parseFloat(font) * 0.2
  };
}

function wrapLabel(text, maxWidth, font) {
  const ctx = svgTextCtx();
  ctx.font = font;
  const words = String(text).split(/\s+/).filter(Boolean);
  if (words.length === 0) return [""];
  const fits = (t) => ctx.measureText(t).width <= maxWidth;
  const lines = [];
  let cur = "";
  for (const w of words) {
    const cand = cur ? cur + " " + w : w;
    if (fits(cand)) { cur = cand; continue; }
    if (cur) lines.push(cur);
    cur = "";
    if (fits(w)) { cur = w; continue; }
    let rem = w;
    while (rem.length) {
      let lo = 1, hi = rem.length;
      while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (fits(rem.slice(0, mid))) lo = mid; else hi = mid - 1;
      }
      lines.push(rem.slice(0, lo));
      rem = rem.slice(lo);
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

function buildSVG() {
  const PAD = 40;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const addBox = (x, y, w, h) => {
    minX = Math.min(minX, x); minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
  };

  const nodeList = [];
  for (const n of treeOrder()) {
    const a = absPos(n), s = boxSize(n);
    nodeList.push({ n, a, s, container: isContainer(n) });
    addBox(a.x, a.y, s.w, s.h);
  }

  const edgeList = [];
  const offsets = parallelOffsets(edges);
  for (const ed of edges) {
    const s = nodes.get(ed.source), t = nodes.get(ed.target);
    if (!s || !t) continue;
    const g = edgeGeometry(absPos(s), boxSize(s), absPos(t), boxSize(t), s, t, offsets.get(ed), ed.dir);
    const [path, lx, ly] = XYF.getSmoothStepPath({
      sourceX: g.sp.x, sourceY: g.sp.y, sourcePosition: g.spPos,
      targetX: g.tp.x, targetY: g.tp.y, targetPosition: g.tpPos
    });
    edgeList.push({ ed, path, lx, ly });
    if (ed.label) addBox(lx - 60, ly - 12, 120, 24);
  }

  if (nodeList.length === 0 && edgeList.length === 0) addBox(0, 0, 100, 50);
  const x0 = Math.floor(minX) - PAD, y0 = Math.floor(minY) - PAD;
  const w = Math.ceil(maxX) - x0 + PAD, h = Math.ceil(maxY) - y0 + PAD;

  let body = "";
  // layer 1: container backgrounds (edges inside a group must stay above it)
  for (const it of nodeList) {
    if (!it.container) continue;
    body += '<rect x="' + it.a.x + '" y="' + it.a.y + '" width="' + it.s.w + '" height="' + it.s.h + '" rx="8"'
      + ' fill="#f2f6ff" fill-opacity="0.5" stroke="#7a8699" stroke-width="2" stroke-dasharray="8 5"/>';
  }
  // layer 2: opaque node backgrounds (shape geometry from the registry)
  for (const it of nodeList) {
    if (it.container) continue;
    const paths = D2SHP.renderShape(it.n.shape || null, { x: it.a.x, y: it.a.y, w: it.s.w, h: it.s.h });
    for (const d of paths) {
      body += '<path d="' + d + '" fill="#ffffff" stroke="#7a8699" stroke-width="2"/>';
    }
  }
  // layer 3: edges with labels
  for (const it of edgeList) {
    const t = it.ed.label != null ? esc(it.ed.label) : "";
    body += '<path d="' + it.path + '" fill="none" stroke="#8a93a6" stroke-width="2"' + edgeMarkers(it.ed) + '/>';
    if (t) {
      const m = svgFontMetrics("15px " + SVG_FONT);
      const y = it.ly + (m.ascent - m.descent) / 2;
      const attrs = 'x="' + it.lx + '" y="' + y + '" text-anchor="middle" font-family="' + SVG_FONT + '" font-size="15"';
      body += '<text ' + attrs + ' fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">' + t + '</text>';
      body += '<text ' + attrs + ' fill="#1f2430">' + t + '</text>';
    }
  }
  // layer 4: node labels (always above edges)
  for (const it of nodeList) {
    const { n, a, s, container } = it;
    const x = a.x, y = a.y;
    const label = n.label != null ? String(n.label) : "";
    const bottom = !container && shapeLabelBottom(n);
    const font = container ? "700 18px " + SVG_FONT : (bottom ? "600 14px " + SVG_FONT : "600 18px " + SVG_FONT);
    const wrapMax = container ? Math.max(20, s.w - 30) : Math.max(20, s.w - 16);
    const lines = wrapLabel(label, wrapMax, font);
    const m = svgFontMetrics(font);
    if (container) {
      const startY = y + 10 + m.ascent;
      for (let i = 0; i < lines.length; i++) {
        body += '<text x="' + (x + 14) + '" y="' + (startY + i * SVG_LINE_H) + '" font-family="' + SVG_FONT
          + '" font-size="18" font-weight="700" fill="#3b5fbd">' + esc(lines[i]) + '</text>';
      }
    } else if (bottom) {
      const cx = x + s.w / 2;
      const fontSize = 14;
      for (let i = 0; i < lines.length; i++) {
        const ly2 = y + s.h - 10 - (lines.length - 1 - i) * SVG_LINE_H + (m.ascent - m.descent) / 2;
        body += '<text x="' + cx + '" y="' + ly2 + '" text-anchor="middle" font-family="' + SVG_FONT
          + '" font-size="' + fontSize + '" font-weight="600" fill="#1f2430">' + esc(lines[i]) + '</text>';
      }
    } else {
      const cx = x + s.w / 2, cy = y + s.h / 2;
      for (let i = 0; i < lines.length; i++) {
        const ly2 = cy + (i - (lines.length - 1) / 2) * SVG_LINE_H + (m.ascent - m.descent) / 2;
        body += '<text x="' + cx + '" y="' + ly2 + '" text-anchor="middle" font-family="' + SVG_FONT
          + '" font-size="18" font-weight="600" fill="#1f2430">' + esc(lines[i]) + '</text>';
      }
    }
  }

  return '<?xml version="1.0" encoding="UTF-8"?>\n'
    + '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="' + x0 + ' ' + y0 + ' ' + w + ' ' + h + '">\n'
    + markerDefs() + '\n'
    + '<rect x="' + x0 + '" y="' + y0 + '" width="' + w + '" height="' + h + '" fill="#ffffff"/>\n'
    + body
    + '</svg>\n';
}

function svgFileName() {
  return (exportName || "diagram").replace(/\.\w+$/, "") + ".svg";
}

function downloadBlob(content, mime, name) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
}

async function exportSVG() {
  const svg = buildSVG();
  const name = svgFileName();
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: name,
        types: [{ description: "SVG-изображение", accept: { "image/svg+xml": [".svg"] } }],
        excludeAcceptAllOption: true
      });
      const writable = await handle.createWritable();
      await writable.write(svg);
      await writable.close();
      setStatus("Экспортировано в " + handle.name, true);
      setTimeout(() => { document.getElementById("outStatus").textContent = ""; }, 1500);
      return;
    } catch (e) {
      if (e.name !== "AbortError") setStatus("Не удалось экспортировать файл", false);
      return;
    }
  }
  downloadBlob(svg, "image/svg+xml", name);
  setStatus("Экспортировано в " + name, true);
  setTimeout(() => { document.getElementById("outStatus").textContent = ""; }, 1500);
}

function saveUiPrefs(extra) {
  try {
    let ui = {};
    const raw = localStorage.getItem(UI_KEY);
    if (raw) { try { ui = JSON.parse(raw) || {}; } catch (e) {} }
    Object.assign(ui, extra);
    localStorage.setItem(UI_KEY, JSON.stringify(ui));
  } catch (e) {}
}

const codePanel = document.getElementById("code-panel");
const divider = document.getElementById("divider");
const splitEl = document.getElementById("split");
divider.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const startX = e.clientX;
  const startW = codePanel.getBoundingClientRect().width;
  const maxW = Math.max(200, splitEl.clientWidth - 320);
  function onMove(ev) {
    const w = Math.max(200, Math.min(maxW, startW + (ev.clientX - startX)));
    codePanel.style.width = w + "px";
  }
  function onUp() {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    saveUiPrefs({ codeWidth: codePanel.getBoundingClientRect().width });
  }
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
});

try {
  const raw = localStorage.getItem(UI_KEY);
  if (raw) {
    const ui = JSON.parse(raw);
    if (ui && Number.isFinite(ui.codeWidth)) {
      const maxW = Math.max(200, splitEl.clientWidth - 320);
      codePanel.style.width = Math.max(200, Math.min(maxW, ui.codeWidth)) + "px";
    }
    if (ui && typeof ui.exportName === "string") exportName = ui.exportName;
  }
} catch (e) {}

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    mode = null;
    edgeSrc = null;
    groupParent = null;
    selectedEdgeId = null;
    setCopyMenu(false);
    render();
    return;
  }
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "Delete" || e.key === "Backspace") {
    if (selectedEdgeId) {
      e.preventDefault();
      deleteEdge(selectedEdgeId);
    } else if (selectedId) {
      e.preventDefault();
      deleteNode(selectedId);
    }
  }
});

svgEl.addEventListener("click", (e) => {
  const g = e.target && e.target.closest ? e.target.closest(".edge-g") : null;
  if (!g) return;
  e.stopPropagation();
  // Like nodes: selecting an edge re-renders the SVG (innerHTML), so a native
  // dblclick would land on a fresh element. Detect the double click manually.
  const now = Date.now();
  const isDbl = lastEdgeClickId === g.dataset.id && now - lastEdgeClickTime < 500;
  lastEdgeClickId = g.dataset.id;
  lastEdgeClickTime = now;
  if (isDbl) {
    renameEdge(g.dataset.id);
  } else {
    selectedId = null;
    selectedEdgeId = selectedEdgeId === g.dataset.id ? null : g.dataset.id;
    render();
  }
});

function clearSelection(e) {
  if (e.target !== pane && e.target !== viewportEl) return;
  if (selectedId || selectedEdgeId) {
    selectedId = null;
    selectedEdgeId = null;
    render();
  }
}
pane.addEventListener("click", clearSelection);

const DEFAULT_SEED = [
  "Client # @d2pos 80,492",
  '"API Server": { # @d2pos 413,224',
  "  Database # @d2pos 40,60",
  "  Cache # @d2pos 40,170",
  "}",
  "Worker # @d2pos -15,308",
  "",
  'Client -> "API Server" {label: HTTPS}',
  '"API Server" -> Worker {label: queue}',
  'Worker -> "API Server".Database {label: read/write}'
].join("\n");

function seed() {
  const r = D2P.parseD2(DEFAULT_SEED);
  if (!r.ok) throw new Error("seed parse failed: " + r.error.message);
  nodes.clear();
  for (const n of r.graph.nodes) nodes.set(n.id, n);
  edges.push(...r.graph.edges);
  order = r.graph.order.slice();
  idCounter = r.graph.idCounter;
}

const restored = loadState();
if (!restored) seed();
if (!order.length) order = D2S.defaultOrder(currentGraph());
applyViewport(viewport);
render();
regenerateTextView();
requestAnimationFrame(() => {
  if (!restored) fitView();
});
</script>
